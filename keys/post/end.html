<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Cormorant"; src: url("fonts/CormorantGaramond.ttf"); font-weight: 300 700; }
  @font-face { font-family: "Cormorant"; src: url("fonts/CormorantGaramond-Italic.ttf"); font-style: italic; font-weight: 300 700; }
  html, body { margin: 0; background: transparent; }
  .wrap { position: absolute; left: 0; right: 0; text-align: center; color: #F2EDE3;
          font-family: "Cormorant", serif; text-shadow: 0 0 22px rgba(7, 9, 15, 0.95); }
  .a { font-size: 46px; font-weight: 400; letter-spacing: 0.01em; font-feature-settings: "liga", "kern"; }
  .b { margin-top: 14px; font-size: 26px; font-weight: 500; font-style: italic; opacity: 0.72; letter-spacing: 0.02em; }
</style></head>
<body>
  <div class="wrap" id="w"><div class="a">Every frame and every note: code.</div><div class="b">Claude Opus 5.5</div></div>
  <script>
    const p = new URLSearchParams(location.search);
    document.body.style.width = p.get("w") + "px"; document.body.style.height = p.get("h") + "px";
    document.getElementById("w").style.bottom = p.get("y") + "px";
  </script>
</body></html>
